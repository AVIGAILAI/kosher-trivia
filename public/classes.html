<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>לוח התחרות הכיתתית — בנות לאה</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family:'Rubik',sans-serif; background:linear-gradient(135deg,#7e3f9d 0%,#5a2c7d 50%,#391c55 100%); min-height:100vh; }
    .bar { transition:width .8s cubic-bezier(.22,1,.36,1); }
    .row { transition:transform .6s cubic-bezier(.22,1,.36,1); }
  </style>
</head>
<body class="p-4 md:p-8 text-white">
  <div class="max-w-4xl mx-auto">
    <header class="flex items-center justify-between gap-3 mb-8">
      <div class="flex items-center gap-4">
        <img src="/media/logo-white.png" alt="בנות לאה" class="h-20 w-20 md:h-28 md:w-28 object-contain drop-shadow-[0_2px_6px_rgba(0,0,0,0.35)]" />
        <div>
          <h1 class="text-4xl font-black drop-shadow">🏆 תחרות הכיתות</h1>
          <p class="text-sm text-purple-100 font-semibold">נקודות נצברות בין כל הכיתות</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="/rooms" class="bg-white/20 hover:bg-white/30 text-white font-bold px-4 py-2 rounded-xl text-sm">🏫 חדרים</a>
        <button id="btnReset" class="bg-rose-500/80 hover:bg-rose-500 text-white font-bold px-4 py-2 rounded-xl text-sm">♻ איפוס נקודות</button>
      </div>
    </header>

    <div id="board" class="space-y-4"></div>
    <p id="empty" class="hidden text-center text-purple-100 font-bold text-xl mt-16">עדיין אין נקודות. כשכיתות ישחקו — הן יופיעו כאן. 🎯</p>
  </div>

  <script>
    const socket = io();
    const $ = (id)=>document.getElementById(id);
    const MEDALS = ['🥇','🥈','🥉'];
    let maxTotal = 1;

    socket.on('connect', () => socket.emit('classboard:hello', {}, (res)=>{ if(res&&res.ok) render(res.standings); }));
    socket.on('classes:state', (s)=> render(s.standings));

    function render(standings){
      standings = standings || [];
      const withPts = standings.filter(s => s.total > 0);
      $('empty').classList.toggle('hidden', withPts.length > 0);
      maxTotal = Math.max(1, ...standings.map(s=>s.total));
      const board = $('board');
      board.innerHTML = '';
      standings.forEach((s, i) => {
        const pct = Math.round((s.total / maxTotal) * 100);
        const leader = i === 0 && s.total > 0;
        const row = document.createElement('div');
        row.className = 'row bg-white/95 text-slate-800 rounded-2xl p-4 shadow-lg ' + (leader ? 'ring-4 ring-amber-300' : '');
        row.innerHTML = `
          <div class="flex items-center gap-3 mb-2">
            <div class="text-3xl w-10 text-center">${MEDALS[i] || (i+1)}</div>
            <div class="text-2xl font-black flex-1">${escapeHtml(s.name)}</div>
            <div class="text-3xl font-black text-purple-800">${s.total.toLocaleString()}<span class="text-sm font-bold text-slate-400"> נק'</span></div>
          </div>
          <div class="h-4 bg-purple-100 rounded-full overflow-hidden">
            <div class="bar h-full rounded-full ${leader?'bg-amber-400':'bg-purple-500'}" style="width:${pct}%"></div>
          </div>
          ${s.live > 0 ? `<div class="text-xs text-emerald-600 font-bold mt-1">▶ משחק פעיל כרגע: +${s.live.toLocaleString()}</div>` : ''}
        `;
        board.appendChild(row);
      });
    }

    $('btnReset').onclick = async () => {
      if(!confirm('לאפס את כל הנקודות הנצברות של הכיתות? (התחלה מחדש)')) return;
      try { await fetch('/api/classes/reset', { method:'POST' }); } catch(e){ alert('שגיאה באיפוס'); }
    };
    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  </script>
</body>
</html>
