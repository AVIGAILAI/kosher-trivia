<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>פלאפון כשר וירטואלי — סימולטור</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family:'Rubik',sans-serif; background:linear-gradient(135deg,#334155,#0f172a); min-height:100vh; }
    .phone { background:#1e293b; border:6px solid #0b1220; box-shadow:0 25px 60px rgba(0,0,0,.5); }
    .screen { background:#c7f0d8; color:#0b3d1f; font-family:'Rubik',monospace; }
    .key { background:#334155; color:#e2e8f0; transition:transform .06s, background .1s; }
    .key:active { transform:scale(.92); background:#475569; }
    .key .sub { font-size:.6rem; color:#94a3b8; display:block; line-height:1; }
    .pulse-input { animation:pulseInput 1s ease-in-out infinite; }
    @keyframes pulseInput { 0%,100%{background:#c7f0d8} 50%{background:#a7e8c2} }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

  <div class="text-center mb-4 text-slate-200">
    <h1 class="text-xl font-black">📞 פלאפון כשר וירטואלי</h1>
    <p class="text-xs text-slate-400">כך ישחק מי שאין לו אינטרנט או דפדפן — חיוג והקשת מקשים בלבד</p>
  </div>

  <div class="phone rounded-[2.5rem] p-4 w-full max-w-xs">
    <!-- מסך -->
    <div id="screen" class="screen rounded-2xl p-4 h-56 mb-4 overflow-hidden flex flex-col">
      <div class="flex justify-between items-center text-[10px] font-bold opacity-70 mb-1">
        <span id="signal">📶 חלול</span>
        <span id="myNumber">—</span>
      </div>
      <div id="screenBody" class="flex-1 flex flex-col justify-center text-center">
        <div id="idleText" class="text-sm font-bold">מוכן לחיוג<br /><span class="text-xs opacity-70">לחצו על הכפתור הירוק</span></div>
        <div id="callText" class="hidden">
          <div id="statusLine" class="text-[11px] font-bold opacity-70 mb-1">בשיחה…</div>
          <div id="transcript" class="text-sm font-bold leading-snug overflow-y-auto max-h-32"></div>
        </div>
      </div>
      <div id="dialedRow" class="text-center text-lg font-black tracking-widest h-6"></div>
    </div>

    <!-- מקלדת -->
    <div id="keypad" class="grid grid-cols-3 gap-2 mb-4">
      <button class="key rounded-xl py-3 font-black text-xl" data-k="1">1</button>
      <button class="key rounded-xl py-3 font-black text-xl" data-k="2">2<span class="sub">א ב ג</span></button>
      <button class="key rounded-xl py-3 font-black text-xl" data-k="3">3<span class="sub">ד ה ו</span></button>
      <button class="key rounded-xl py-3 font-black text-xl" data-k="4">4<span class="sub">ז ח ט</span></button>
      <button class="key rounded-xl py-3 font-black text-xl" data-k="5">5<span class="sub">י כ ל</span></button>
      <button class="key rounded-xl py-3 font-black text-xl" data-k="6">6<span class="sub">מ נ ס</span></button>
      <button class="key rounded-xl py-3 font-black text-xl" data-k="7">7<span class="sub">ע פ צ</span></button>
      <button class="key rounded-xl py-3 font-black text-xl" data-k="8">8<span class="sub">ק ר ש</span></button>
      <button class="key rounded-xl py-3 font-black text-xl" data-k="9">9<span class="sub">ת</span></button>
      <button class="key rounded-xl py-3 font-black text-xl" data-k="*">∗<span class="sub">מחק</span></button>
      <button class="key rounded-xl py-3 font-black text-xl" data-k="0">0<span class="sub">רווח</span></button>
      <button class="key rounded-xl py-3 font-black text-xl" data-k="#">#<span class="sub">סיום</span></button>
    </div>

    <!-- כפתורי שיחה -->
    <div class="grid grid-cols-2 gap-3">
      <button id="btnDial" class="bg-emerald-500 hover:bg-emerald-600 text-white font-black py-3 rounded-2xl shadow-lg text-lg">📞 חייג</button>
      <button id="btnHangup" class="bg-rose-500 hover:bg-rose-600 text-white font-black py-3 rounded-2xl shadow-lg text-lg opacity-40" disabled>📵 נתק</button>
    </div>
  </div>

  <label class="mt-4 flex items-center gap-2 text-slate-300 text-xs">
    <input id="voiceToggle" type="checkbox" checked class="w-4 h-4" /> הקראה קולית (Web Speech)
  </label>

  <script>
    const socket = io();
    const $ = (id) => document.getElementById(id);
    let inCall = false;

    // מספר "פלאפון" אקראי לזיהוי המתקשר
    const myNumber = '05' + (Math.floor(Math.random()*8)) + '-' + String(Math.floor(1000000 + Math.random()*8999999));
    $('myNumber').innerText = myNumber;

    // --- הקראה קולית בעברית ---
    function speak(text){
      if(!$('voiceToggle').checked) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'he-IL';
        const heVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('he'));
        if(heVoice) u.voice = heVoice;
        u.rate = 1.0;
        window.speechSynthesis.speak(u);
      } catch(e){ /* אם אין קול עברי — הטקסט עדיין מוצג על המסך */ }
    }
    // טעינת קולות (בחלק מהדפדפנים אסינכרוני)
    if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => {};

    function setInCall(on){
      inCall = on;
      $('idleText').classList.toggle('hidden', on);
      $('callText').classList.toggle('hidden', !on);
      $('signal').innerText = on ? '📞 בשיחה' : '📶 חלול';
      $('btnDial').disabled = on; $('btnDial').classList.toggle('opacity-40', on);
      $('btnHangup').disabled = !on; $('btnHangup').classList.toggle('opacity-40', !on);
      if(!on){ $('transcript').innerHTML=''; $('dialedRow').innerText=''; $('screen').classList.remove('pulse-input'); $('statusLine').innerText='בשיחה…'; }
    }

    function addLine(text){
      const t = $('transcript');
      t.innerHTML = `<div class="mb-1">🔊 ${escapeHtml(text)}</div>`;
      t.scrollTop = t.scrollHeight;
    }

    // --- חיוג / ניתוק ---
    $('btnDial').onclick = () => {
      if(inCall) return;
      setInCall(true);
      addLine('מחייג…');
      socket.emit('sim:dial', { phone: myNumber });
    };
    $('btnHangup').onclick = () => {
      if(!inCall) return;
      socket.emit('sim:hangup');
      window.speechSynthesis && window.speechSynthesis.cancel();
      setInCall(false);
    };

    // --- הקשות מקלדת ---
    document.querySelectorAll('#keypad .key').forEach(btn => {
      btn.onclick = () => {
        const k = btn.dataset.k;
        if(!inCall){ return; }
        // הצגת ההקשה
        const row = $('dialedRow');
        row.innerText = (row.innerText + k).slice(-8);
        socket.emit('sim:digit', { digit: k });
      };
    });

    // --- הודעות מהשרת (השער הטלפוני) ---
    socket.on('sim:say', ({ text }) => { addLine(text); speak(text); });
    socket.on('sim:status', ({ expectingInput, hint }) => {
      $('statusLine').innerText = hint || (expectingInput ? 'ממתין להקשה…' : '');
      $('screen').classList.toggle('pulse-input', !!expectingInput);
      $('dialedRow').innerText = '';
    });
    socket.on('sim:ended', () => {
      addLine('השיחה הסתיימה.');
      setTimeout(() => setInCall(false), 1500);
    });

    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  </script>
</body>
</html>
